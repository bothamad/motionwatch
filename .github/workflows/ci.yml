name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: pytest -q

  debian:
    # Tests against the Debian-packaged OpenCV that the .deb depends on
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3-opencv python3-numpy python3-yaml python3-requests python3-pytest
      - run: python3 -m pytest -q
