name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -oP '__version__ = "\K[^"]+' src/motionwatch/__init__.py)
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != __version__ $PKG"; exit 1; }
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev] build && pytest -q

      - name: Build Python sdist/wheel
        run: python -m build

      - name: Build .deb
        run: |
          mkdir -p dist
          find src -name '__pycache__' -prune -exec rm -rf {} +
          docker run --rm -e VERSION -v "$PWD:/w" -w /w goreleaser/nfpm:v2.41.1 \
            package -f nfpm.yaml -p deb -t dist/

      - name: Smoke-test .deb on Debian
        run: |
          docker run --rm -v "$PWD/dist:/dist" debian:bookworm sh -ec '
            apt-get update -qq
            apt-get install -y -qq /dist/motionwatch_*_all.deb >/dev/null
            motionwatch --version
            test -f /usr/lib/motionwatch/motionwatch/web/index.html
            motionwatch -d /tmp/mw --web 127.0.0.1:8080 run &
            sleep 5
            python3 -c "import urllib.request as u; [print(p, u.urlopen(\"http://127.0.0.1:8080\" + p).status) for p in (\"/\", \"/static/app.js\", \"/static/app.css\", \"/api/session\")]"'

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          IMAGE=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
