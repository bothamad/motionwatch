services:
  motionwatch:
    image: ghcr.io/bothamad/motionwatch:latest
    # build: .
    container_name: motionwatch
    restart: unless-stopped
    # Host networking lets "Find cameras" reach the network; the web interface is on port 8080.
    # (Without camera search you can use  ports: ["8080:8080"]  instead.)
    network_mode: host
    environment:
      TZ: Etc/UTC
    volumes:
      - ./data:/data         # settings, password and alert pictures
    # For USB cameras:
    # devices: ["/dev/video0:/dev/video0"]
