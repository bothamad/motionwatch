[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motionwatch"
dynamic = ["version"]
description = "CCTV/RTSP motion detection with scheduled Telegram photo alerts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "opencv-python-headless>=4.5",
  "numpy>=1.20",
  "PyYAML>=5.4",
  "requests>=2.25",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Video :: Capture",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
motionwatch = "motionwatch.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "motionwatch.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
