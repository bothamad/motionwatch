services:
  motionwatch:
    image: ghcr.io/bothamad/motionwatch:latest
    # build: .
    container_name: motionwatch
    restart: unless-stopped
    ports:
      - "8080:8080"          # web interface
    environment:
      TZ: Etc/UTC
    volumes:
      - ./data:/data         # settings, password and alert pictures
    # For USB cameras:
    # devices: ["/dev/video0:/dev/video0"]
